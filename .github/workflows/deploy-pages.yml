name: Deploy Dinner Engine to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Paprika archive import
        run: npm run test:import
      - name: Test local dinner matching
        run: npm run test:matching
      - name: Test disabled AI foundation
        run: npm run test:ai-foundation
      - name: Test staged AI pilot safety
        run: npm run test:ai-pilot
      - name: Test full Paprika library request contract
        run: npm run test:ai-paprika
      - name: Test Paprika privacy and local sharing preview
        run: npm run test:ai-paprika-browser
      - name: Test local-only full-library AI readiness and consent
        run: npm run test:ai-readiness
      - name: Validate larger catalog readiness
        run: npm run test:ai-catalog
      - name: Verify real Paprika AI activation remains blocked
        run: npm run test:ai-activation-gate
      - name: Test non-executing Paprika Responses adapter
        run: npm run test:ai-paprika-model
      - name: Test injected OpenAI transport without provider calls
        run: npm run test:ai-transport
      - name: Test batch ledger orchestration with synthetic provider
        run: npm run test:ai-orchestrator
      - name: Test staged AI budget reservations
        run: npm run test:ai-money
      - name: Validate Cloudflare Worker bundle without deploying
        run: |
          npm install --prefix backend --no-audit --no-fund
          cd backend
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Build website
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
